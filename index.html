<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>생기부 체크리스트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#eef2f9;--card:#fff;--ink:#18202e;--sub:#56617a;--muted:#8d97ab;--line:#d6deeb;
--acc:#1f5fbf;--accbg:#e7effb;--ok:#1d8a5b;--okbg:#e5f5ed;--red:#c0392b;--redbg:#fdeeec;--hl:#ffe68a;--warnbg:#fff8e1}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;word-break:keep-all;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 80px}
.hidden{display:none!important}

/* 머리 */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top .brand{font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.04em}
.top h1{margin:2px 0 0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.top .who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sub)}
.top .who b{color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:disabled{background:#9db3d6;border-color:#9db3d6;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:13px}

/* 첫 화면 */
.hero{text-align:center;padding:5vh 0 3vh}
.hero h2{font-size:clamp(26px,5vw,38px);margin:0 0 8px;font-weight:800;letter-spacing:-.02em}
.hero p{color:var(--sub);margin:0;line-height:1.6}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:28px}
.role{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:26px 22px;text-align:left;cursor:pointer;transition:border-color .2s,transform .2s}
.role:hover{border-color:var(--acc);transform:translateY(-2px)}
.role .ic{font-size:30px}
.role h3{margin:10px 0 6px;font-size:22px}
.role p{margin:0;color:var(--sub);font-size:14px;line-height:1.6}
.login{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;max-width:460px;margin:24px auto 0}
.login h3{margin:0 0 16px;font-size:20px}
.login label{display:block;font-size:13px;font-weight:700;color:var(--sub);margin:12px 0 6px}
.login input,.login select{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#fff;font-size:16px}
.login .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.login .acts{display:flex;gap:8px;margin-top:20px}
.login .acts .pri{flex:1}
.err{color:var(--red);font-size:14px;margin-top:10px;min-height:1em}

/* 요약 */
.sum{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:16px}
.sum .line{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sum .pct{font-size:28px;font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums}
.sum .bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
.sum .bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .4s}
.assign{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:6px;background:var(--accbg);color:var(--acc)}
.tag.red{background:var(--redbg);color:var(--red)}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.car{background:#f3e8ff;color:#7a3db8}
.carbox{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:14px}
.carbox .cl{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag.gray{background:#eef0f4;color:var(--sub)}

/* 날짜 띠 */
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;margin-bottom:6px;scrollbar-width:thin}
.chipd{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;text-align:center;cursor:pointer;min-width:76px}
.chipd b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.chipd span{font-size:11.5px;color:var(--sub)}
.chipd.now{border:2px solid var(--acc);background:var(--accbg)}
.chipd.sel{outline:3px solid var(--ink);outline-offset:1px}
.mine{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin-bottom:12px}
.mine h4{margin:0 0 6px;font-size:13px;color:var(--sub);font-weight:800;letter-spacing:.04em}
.mrow{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:start}
.mrow:first-of-type{border-top:0}
.mk{font-weight:800;font-size:14px;padding-top:3px}
.mv{display:flex;flex-direction:column;gap:6px}
.mv>.tag,.mv>.mnote{align-self:flex-start}
.mrow .mv{flex-direction:row;flex-wrap:wrap;align-items:center}
.msub{width:100%;display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px}
.tag.big{font-size:14px;padding:4px 10px}
.mnote{font-size:13px;color:var(--sub);margin-left:4px}
.sendinfo{display:inline-block;margin:10px 0 6px;background:var(--okbg);color:var(--ok);font-weight:700;padding:6px 12px;border-radius:8px}
.sendbar{background:var(--okbg);color:var(--ok);border:1px solid #a9d9c1;border-radius:10px;padding:9px 14px;font-size:14px;margin-bottom:12px}
.adminbar{background:#fff4e5;border:1px solid #f3c98b;color:#7a4b00;border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:12px;line-height:1.6}
.adrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.adrow input{height:34px;border:1px solid var(--line);border-radius:8px;padding:0 8px;margin-left:6px}
.qopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.qopt{padding:14px 10px;font-size:16px}
.qopt:hover{background:var(--accbg)}
.sepline{display:flex;align-items:center;gap:12px;margin:30px 0 12px;color:var(--muted);font-size:13px;font-weight:700}
.sepline::before,.sepline::after{content:"";flex:1;height:1px;background:var(--line)}
.jcband{display:flex;align-items:center;gap:14px;padding:18px 20px;border-radius:16px;background:#e2f4f1;border:2px solid #0f766e;color:#0b4f49;text-decoration:none;transition:transform .2s}
.jcband:hover{transform:translateY(-2px)}
.jcband .ic{font-size:28px}
.jcband .tx{flex:1;line-height:1.5}.jcband b{font-size:18px;display:block}
.jcband small{font-size:13px;color:#2d6b64}
.jcband .go{font-weight:800;white-space:nowrap}
.jclink{display:inline-block;margin-top:10px;padding:10px 16px;border-radius:10px;background:#0f766e;color:#fff;font-weight:700;text-decoration:none}
.bigs{display:grid;gap:14px;margin-top:10px}
.big{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:22px 22px;border-radius:18px;border:2px solid;cursor:pointer;text-decoration:none;color:inherit;font:inherit;transition:transform .2s}
.big:hover{transform:translateY(-2px)}
.big.blue{background:#fff;border-color:var(--acc)}
.big.green{background:#e2f4f1;border-color:#0f766e;color:#0b4f49}
.big .bn{flex:0 0 auto;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff}
.big.blue .bn{background:var(--acc)}.big.green .bn{background:#0f766e}
.big .bt{flex:1;line-height:1.5}
.big .bt b{display:block;font-size:21px;font-weight:800}
.big .bt em{display:block;font-style:normal;font-size:14px;font-weight:700;opacity:.85;margin:2px 0 4px}
.big .bt small{display:block;font-size:13.5px;color:var(--sub)}
.big.green .bt small{color:#2d6b64}
.big .go{font-weight:800;white-space:nowrap}
.kick{display:inline-block;font-size:13px;font-weight:800;padding:4px 12px;border-radius:99px;margin-bottom:10px}
.kick.blue{background:var(--accbg);color:var(--acc)}
@media (max-width:560px){.big{flex-wrap:wrap}.big .go{width:100%;text-align:right}}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:4px}
.pager .btn:disabled{opacity:.4;cursor:default}
.chipd.done{border-color:#a9d9c1}.chipd.done span{color:var(--ok);font-weight:700}
.chipd.late span{color:var(--red);font-weight:700}

/* 날짜 카드 */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden;transition:box-shadow .3s}
.card.past:not(.open){opacity:.72}
.card.spot{border:2px solid var(--acc);box-shadow:0 8px 28px rgba(31,95,191,.16)}
.card .ch{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:default;width:100%;background:none;border:0;text-align:left}
.card .dt{flex:0 0 auto;min-width:86px}
.card .dt b{display:block;font-size:19px;font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums;white-space:nowrap}
.card .dt small{font-size:12px;color:var(--sub)}
.card .tt{flex:1;min-width:0}
.card .tt h3{margin:0;font-size:17px;font-weight:800;line-height:1.35}
.card .tt .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.card .arw{flex:0 0 auto;color:var(--muted);transition:transform .2s}
.card.open .arw{transform:rotate(180deg)}
.spotlbl{display:inline-block;font-size:12px;font-weight:800;color:#fff;background:var(--acc);border-radius:6px;padding:2px 8px;margin-bottom:6px}
.cb{display:none;padding:0 18px 18px;border-top:1px solid var(--line)}
.card.open .cb{display:block}

.sec{margin-top:16px}
.sec h4{margin:0 0 8px;font-size:14px;color:var(--sub);font-weight:800;letter-spacing:.02em}
.chk{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;line-height:1.5}
.chk input{width:22px;height:22px;flex:0 0 auto;margin:1px 0 0;accent-color:var(--acc);cursor:pointer}
.chk.on{background:var(--okbg);border-color:#a9d9c1}
.chk .tx b{font-weight:800}
.chk .tx small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.chk.lock{opacity:.5;cursor:not-allowed}.chk.lock input{cursor:not-allowed}
.note{background:var(--warnbg);border-left:4px solid #e0a800;border-radius:8px;padding:10px 14px;font-size:14px;line-height:1.65}
.note ul,.guide ul{margin:0;padding-left:18px}
.note li,.guide li{margin:2px 0}
.no{color:var(--red);font-weight:800}
.guide{background:var(--accbg);border-radius:8px;padding:10px 14px;font-size:14px;line-height:1.65}
.path{font-weight:700;color:var(--acc)}
.shots{display:grid;gap:10px}
.shot{margin:0;cursor:zoom-in}
.shot img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:8px}
.shot figcaption{font-size:12px;color:var(--muted);text-align:right;margin-top:3px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.steps div{font-size:12.5px;font-weight:700;text-align:center;padding:7px 4px;border-radius:8px;background:#eef0f4;color:var(--sub)}
.steps div.on{background:var(--okbg);color:var(--ok)}
.foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px dashed var(--line)}
.foot .st{font-size:13px;color:var(--sub);flex:1}
.foot .st b{color:var(--ok)}
.memo{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;resize:vertical;margin-top:10px;font-family:inherit}
.grp{font-size:13px;font-weight:800;color:var(--ink);margin:12px 0 6px}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;max-width:calc(100% - 32px);text-align:center;z-index:60}
.toast.on{opacity:1;transform:translate(-50%,0)}
.lb{position:fixed;inset:0;z-index:50;background:rgba(15,20,30,.85);display:none;align-items:center;justify-content:center;padding:3vh 3vw;cursor:zoom-out}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:100%;border-radius:8px;background:#fff}
.demo{background:var(--warnbg);border:1px solid #f0d78a;border-radius:10px;padding:8px 12px;font-size:13px;color:#7a5b00;margin-bottom:14px}
@media (max-width:560px){
  .card .ch{padding:14px}.cb{padding:0 14px 14px}
  .card .dt{min-width:70px}.card .dt b{font-size:16px}
  .top .who{margin-left:0;width:100%;justify-content:flex-end}
}
</style>
</head>

}

/* 교과교사 본인 확인: 내 수업반(또는 동아리·부담임 반) 고르기 */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function quiz(key){
  /* 틀린 보기에서 뺄 반: 진로 수업 반, 담임 반, 부담임 반 */
  const avoid = new Set([...(JINRO_CLS[key]||[]), ...HOMEROOMS.filter(h=>norm(h.name)===norm(key)||h.sub===key).map(h=>`${h.g}-${h.c}`)]);
  const mineCls = [...new Set((TEACHERS[key]||[]).flatMap(a=>a.classes.map(c=>`${a.g}-${String(c).split('·')[0]}`)))];
  if(mineCls.length){
    const all=[]; for(const g in CLASS_COUNT) for(let c=1;c<=Math.min(8,CLASS_COUNT[g]);c++) all.push(`${g}-${c}`);
    const wrong = shuffle(all.filter(x=>!mineCls.includes(x) && !avoid.has(x))).slice(0,4);
    const right = mineCls[Math.floor(Math.random()*mineCls.length)];
    return { q:'선생님이 <b>수업하는 반</b>을 하나 고르세요.', opts:shuffle([right,...wrong]).map(x=>[x, x.replace('-','학년 ')+'반']), ok:x=>mineCls.includes(x) };
  }
  const myClubs = CLUBS[key]||[];
  if(myClubs.length){
    const others = shuffle(Object.entries(CLUBS).filter(([k])=>k!==key).flatMap(([,v])=>v)).slice(0,4);
    const right = myClubs[Math.floor(Math.random()*myClubs.length)];
    return { q:'선생님이 <b>지도하는 동아리</b>를 하나 고르세요.', opts:shuffle([right,...others]).map(x=>[x,x]), ok:x=>myClubs.includes(x) };
  }
  const subs = SUBT(key).map(h=>`${h.g}-${h.c}`);
  const all = HOMEROOMS.map(h=>`${h.g}-${h.c}`).filter(x=>!subs.includes(x) && !avoid.has(x));
  return { q:'선생님이 <b>부담임을 맡은 반</b>을 고르세요.', opts:shuffle([subs[0],...shuffle(all).slice(0,4)]).map(x=>[x, x.replace('-','학년 ')+'반']), ok:x=>subs.includes(x) };
}

  if(store.get('sgb:ok:'+key)){ state = { role:'subject', teacher:key, name:key }; enter(); return; }

/* ---------- 항목 목록 (카드별 체크 키) ---------- */
function keysOf(card){
  if(state.role==='homeroom') return itemsOf(card).map(i=>i.id);
  if(card.kind==='seteuk'){
    const ks = S_PRE.map(p=>p.id);
    (TEACHERS[state.teacher]||[]).forEach((a,ai)=>a.classes.forEach(c=>{ ks.push(`c${ai}-${c}`); if(a.ncs) ks.push(`n${ai}-${c}`); }));
    return ks;
  }
  if(card.kind==='career') return (CAREER[state.teacher]||[]).flatMap(a=>a.classes.map(c=>`${card.items[0].id}${a.g}-${c}`));
  if(card.kind==='club') return (CLUBS[state.teacher]||[]).flatMap((cl,ci)=>card.items.map(i=>`${i.id}${ci}`));
  return card.items.map(i=>i.id);
}
const itemsOf = card => (card.items||[]).filter(i=>!i.g || state.admin || i.g.includes(state.g));
const cardsNow = () => state.role==='homeroom' ? H_CARDS : sCards();
const isOn = (cid,k) => !!(data[cid] && data[cid].checks && data[cid].checks[k]);
function cardDone(card){ const ks=keysOf(card); return ks.length>0 && ks.every(k=>isOn(card.id,k)); }
function cardCount(card){ const ks=keysOf(card); return [ks.filter(k=>isOn(card.id,k)).length, ks.length]; }

    if(other.length) mine += row('참고', `<span class="mnote">${other.join('·')} 체크는 첫 화면에서 <b>교과교사</b>로 들어가서 해요.</span>`);
  } else {
    mine = row('수업반', (TEACHERS[T]||[]).map(a=>`<div class="msub"><b>${esc(a.subj)}</b>${a.ncs?' <span class="tag">NCS</span>':''} ${a.classes.map(c=>`<span class="tag big">${clsName(a.g,c)}</span>`).join('')}</div>`).join(''))
      + row('동아리', (CLUBS[T]||[]).map(c=>`<span class="tag ok big">${esc(c)}</span>`).join(''))
      + row('부담임', SUBT(T).map(h=>`<span class="tag gray big">${h.g}학년 ${h.c}반</span><span class="mnote">담임 ${esc(h.name)}</span>`).join(''))
      + (hr ? row('담임반', `<span class="tag gray big">${hr.g}학년 ${hr.c}반</span><span class="mnote">담임 체크는 <b>담임교사</b>로 들어가서 해요.</span>`) : '');
    if(!mine) mine = row('담당', '<span class="mnote">공통 일정(12/16 교차점검 등)만 있어요.</span>');
  }
  app.innerHTML = `
    ${demo?`<div class="demo">미리보기: 오늘을 <b>${demo}</b>로 보고 있어요.</div>`:''}
    ${formOk||state.admin?'':'<div class="demo">시트 연결 전이에요. 체크는 이 기기에 저장되고, 제출은 연결 후 시트에 쌓여요.</div>'}
    ${state.admin?`<div class="adminbar"><b>🔧 관리자 미리보기</b> — 선생님 화면을 그대로 보여 줘요. 체크해도 <b>시트로 전송되지 않아요.</b>
      <div class="adrow"><label>오늘 날짜로 보기 <input type="date" id="adDay" min="2026-11-20" max="2026-12-31" value="${ADMIN_DAY||''}"></label>
      <button class="btn sm" id="adNow">실제 오늘</button><button class="btn sm" id="adReset">체크 모두 지우기</button></div></div>`
      :`<div class="sendbar">✔ 체크하면 <b>담당자에게 바로 전달</b>돼요. 해제해도 바로 반영돼요.</div>`}
    ${state.admin&&state.role==='homeroom'?'':`<div class="mine"><h4>내 담당</h4>${mine}</div>`}
    <div class="sum"><div class="line"><span class="pct" id="pct">0%</span><span id="pcttx" style="color:var(--sub);font-size:14px"></span></div><div class="bar"><i id="pbar"></i></div>${state.role==='homeroom'?'<div class="carbox" id="carbox"></div>':''}</div>
    <div class="strip" id="strip"></div>
    <div id="cards"></div>
    <div class="pager"><button class="btn" id="prevD">← 이전 날짜</button><button class="btn" id="nextD">다음 날짜 →</button></div>`;
  const wrap = $('#cards');
  cards.forEach(card=>{
    const el = document.createElement('div');
    el.className = 'card open' + (card===spot?' spot':'') + (dateOf(card.end)<td?' past':'');
    el.id = 'card-'+card.id;
    wrap.appendChild(el);
    renderCard(card, el, card===spot, td);
  });
  state.sel = spot.id;
  if(state.admin){
    $('#adDay').onchange = e => { ADMIN_DAY = e.target.value || null; board(); };
    $('#adNow').onclick = () => { ADMIN_DAY = null; board(); };
    $('#adReset').onclick = () => { data = {}; save(); board(); toast('미리보기 체크를 모두 지웠어요.'); };
  }
  $('#prevD').onclick = () => { const i=cards.findIndex(c=>c.id===state.sel); if(i>0) selectDate(cards[i-1].id); };
  $('#nextD').onclick = () => { const i=cards.findIndex(c=>c.id===state.sel); if(i<cards.length-1) selectDate(cards[i+1].id); };
  refreshSummary();
  selectDate(spot.id, true);
}

function selectDate(id, first){
  const cards = cardsNow(); state.sel = id;
  cards.forEach(c=>{ const el=$('#card-'+c.id); if(el) el.classList.toggle('hidden', c.id!==id); });
  document.querySelectorAll('.chipd').forEach(b=>b.classList.toggle('sel', b.dataset.go===id));
  const i = cards.findIndex(c=>c.id===id);
  $('#prevD').disabled = i<=0; $('#nextD').disabled = i>=cards.length-1;
  if(!first){ const st=$('#strip'); st.scrollIntoView({behavior:'smooth',block:'start'}); }
  const chip = document.querySelector(`.chipd[data-go="${id}"]`); if(chip) chip.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
}

function dday(card, td){
  const diff = Math.round((dateOf(card.end)-td)/86400000);
  if(diff>0) return `<span class="tag">D-${diff}</span>`;
  if(diff===0) return '<span class="tag red">오늘 마감</span>';
  return cardDone(card)?'':'<span class="tag red">마감 지남</span>';
}

function renderCard(card, el, isSpot, td){
  const [n,t] = cardCount(card), d = data[card.id]||{};
  el.innerHTML = `
    <button class="ch" type="button"><div class="dt"><b>${card.label}</b><small>${card.dow}</small></div>
      <div class="tt">${isSpot?'<span class="spotlbl">지금 할 일</span>':''}<h3>${card.title}</h3>
        <div class="meta">${dday(card,td)}<span class="tag ${n===t?'ok':'gray'}">${n===t?'완료 ✓':`${n}/${t}`}</span>${d.dirty?'<span class="tag">전송 중…</span>':d.sent?`<span class="tag ok">기록 ${d.sent}</span>`:''}</div></div>
      </button>
    <div class="cb">${bodyHtml(card)}</div>`;
  bindBody(card, el);
}

function chkHtml(cid, key, t, s, lock, car){
  const on = isOn(cid,key);
  return `<label class="chk${on?' on':''}${lock?' lock':''}"><input type="checkbox" data-k="${key}" ${on?'checked':''} ${lock?'disabled':''}><span class="tx">${car?'<span class="tag car">진로</span> ':''}${t}${s?`<small>${s}</small>`:''}</span></label>`;
}
function shotsHtml(card){
  if(!card.shots) return '';
  return `<div class="sec"><h4>나이스 화면</h4><div class="shots">${card.shots.map(([k,cap])=>`<figure class="shot"><img src="${IMG[k]}" alt="${esc(cap)}" loading="lazy"><figcaption>${esc(cap)}</figcaption></figure>`).join('')}</div></div>`;
}

function bodyHtml(card){
  let h = '';
  if(['h1216','h1223','s1216','s1223'].includes(card.id)) h += `<div class="sec"><a class="jclink" href="selfcheck.html">📝 자체점검표 열기 →</a></div>`;
  if(card.id==='h1216' && state.sub) h += `<div class="sec"><div class="guide">우리 반 3차 점검자는 <b>부담임 ${esc(state.sub)}</b> 선생님이에요.</div></div>`;
  if(card.kind==='seteuk'){
    const preDone = S_PRE.every(p=>isOn(card.id,p.id));
    h += `<div class="sec"><h4>먼저 확인해요</h4><div class="steps">${S_PRE.map((p,i)=>`<div class="${isOn(card.id,p.id)?'on':''}">${i+1}. ${['작성 안내','맞춤법','기재 불가'][i]}</div>`).join('')}</div>
      <div class="note"><ul>${card.note.map(x=>`<li>${x}</li>`).join('')}</ul></div>
      <div class="sec">${chkHtml(card.id,'p1',S_PRE[0].t)}</div>
      ${chkHtml(card.id,'p2',S_PRE[1].t,S_PRE[1].s)}
      <div class="note" style="margin:8px 0"><b>기재 불가</b><ul>${card.ban.map(x=>`<li><span class="no">✕</span> ${x}</li>`).join('')}</ul></div>
      ${chkHtml(card.id,'p3',S_PRE[2].t)}</div>
      <div class="sec"><h4>반별 세특 입력 ${preDone?'':'<span style="font-weight:600;color:var(--muted)">· 위 3단계를 먼저 체크하면 열려요</span>'}</h4>
      ${(TEACHERS[state.teacher]||[]).map((a,ai)=>`<div class="grp">${esc(a.subj)} · ${a.g}학년${a.ncs?' <span class="tag">NCS</span>':''}</div>`
        + a.classes.map(c=>chkHtml(card.id,`c${ai}-${c}`,`<b>${clsName(a.g,c)}</b> 전원 세특 입력 완료`,'',!preDone)
          + (a.ncs?chkHtml(card.id,`n${ai}-${c}`,`${clsName(a.g,c)} <b>이수한 모든 능력단위</b> 기재`,'[능력단위: 능력단위명] 표기 · NCS 이수상황과 대조',!preDone):'')).join('')).join('')}</div>`;
  } else if(card.kind==='career'){
    h += `<div class="sec"><h4>체크 항목</h4>${(CAREER[state.teacher]||[]).map(a=>a.classes.map(c=>chkHtml(card.id,`${card.items[0].id}${a.g}-${c}`,`<b>${a.g}-${c}반</b> ${strip(card.items[0].t).replace('반별 ','')}`)).join('')).join('')}</div>`;
  } else if(card.kind==='club'){
    h += `<div class="sec">${(CLUBS[state.teacher]||[]).map((cl,ci)=>`<div class="grp">🎯 ${esc(cl)}</div>`+card.items.map(i=>chkHtml(card.id,`${i.id}${ci}`,i.t,i.s)).join('')).join('')}</div>`;
  } else {
    h += `<div class="sec"><h4>체크 항목</h4>${itemsOf(card).map(i=>chkHtml(card.id,i.id,(i.g?`<span class="tag gray">${i.g.join('·')}학년</span> `:'')+i.t,(i.gs&&!state.admin&&i.gs[state.g])||i.s,false,i.car)).join('')}</div>`;
  }
  if(card.kind!=='seteuk' && card.note) h += `<div class="sec"><h4>기재 유의사항</h4><div class="note"><ul>${card.note.map(x=>`<li>${x}</li>`).join('')}</ul></div></div>`;
  if(card.guide) h += `<div class="sec"><h4>이렇게 해요</h4><div class="guide">${card.guide}</div></div>`;
  h += shotsHtml(card);
  const d = data[card.id]||{};
  h += `<textarea class="memo" placeholder="메모 (선택) — 미완료 사유, 요청사항 등">${esc(d.memo||'')}</textarea>
    <div class="foot"><span class="st">${state.admin?'🔧 관리자 미리보기 — 시트로 전송되지 않아요.':d.dirty?'⏳ 시트로 보내는 중…':d.sent?`✅ 시트에 기록됨 <b>${d.sent}</b>`:'체크하면 시트에 자동으로 기록돼요.'}<br><small>체크·해제할 때마다 자동 전송돼요. 메모는 입력 칸을 벗어나면 전송돼요.</small></span></div>`;
  return h;
}

function bindBody(card, el){
  el.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.onchange=()=>{
    data[card.id] = data[card.id] || {checks:{}};
    data[card.id].checks = data[card.id].checks || {};
    data[card.id].checks[cb.dataset.k] = cb.checked;
    data[card.id].dirty = true;
    save();
    renderCard(card, el, el.classList.contains('spot'), today());
    el.classList.add('open');
    refreshSummary();
    autoSend(card);
  });
  const memo = el.querySelector('.memo');
  memo.oninput = () => { data[card.id] = data[card.id] || {checks:{}}; data[card.id].memo = memo.value; data[card.id].dirty = true; save(); };
  memo.onchange = () => autoSend(card, 300);
  el.querySelectorAll('.shot img').forEach(im=>im.onclick=()=>{ const lb=$('#lb'); lb.querySelector('img').src=im.src; lb.classList.add('on'); });
}

function refreshSummary(){
  const cards = cardsNow(); let a=0,b=0;
  cards.forEach(c=>{ const [x,y]=cardCount(c); a+=x; b+=y; });
  const p = b?Math.round(a/b*100):0;
  $('#pct').textContent = p+'%';
  $('#pcttx').textContent = `전체 ${b}개 중 ${a}개 완료 · 날짜 ${cards.filter(cardDone).length}/${cards.length}`;
  $('#pbar').style.width = p+'%';
  const cb = $('#carbox');
  if(cb){
    const list = H_CARDS.flatMap(c=>itemsOf(c).filter(i=>i.car).map(i=>({c, i, on:isOn(c.id,i.id)})));
    cb.innerHTML = `<b>🧭 진로 체크</b> <span style="color:var(--sub)">${list.filter(x=>x.on).length}/${list.length}</span><div class="cl">${list.map(x=>`<button class="tag ${x.on?'ok':'car'}" style="border:0;cursor:pointer" data-go="${x.c.id}">${x.c.label} ${x.i.sh}${x.on?' ✓':''}</button>`).join('')}</div>`;
    cb.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>selectDate(b.dataset.go));
  }
  const td = today(), spot = cards.find(c=>dateOf(c.end)>=td) || cards[cards.length-1];
  $('#strip').innerHTML = cards.map(c=>{
    const done=cardDone(c), late=!done && dateOf(c.end)<td;
    return `<button class="chipd${c===spot?' now':''}${done?' done':''}${late?' late':''}" data-go="${c.id}"><b>${c.label}</b><span>${done?'완료':late?'지남':c===spot?'지금':cardCount(c).join('/')}</span></button>`;
  }).join('');
  $('#strip').querySelectorAll('[data-go]').forEach(b=>{ b.classList.toggle('sel', b.dataset.go===state.sel); b.onclick=()=>selectDate(b.dataset.go); });
}

/* ---------- 시트로 보낼 값 ---------- */
const mark = (n,t) => t===0 ? '—' : n===t ? '✅ 완료' : n===0 ? `⬜ 0/${t}` : `🟡 ${n}/${t}`;
function cardText(card){
  const [n,t] = cardCount(card);
  if(state.role==='subject' && card.kind==='seteuk'){
    const cls=[], left=[], ncs=[];
    (TEACHERS[state.teacher]||[]).forEach((a,ai)=>a.classes.forEach(c=>{
      const on=isOn(card.id,`c${ai}-${c}`); cls.push(on); if(!on) left.push(clsName(a.g,c).replace('반',''));
      if(a.ncs) ncs.push(isOn(card.id,`n${ai}-${c}`)); }));
    const done=cls.filter(Boolean).length, nd=ncs.filter(Boolean).length;
    let txt = mark(done, cls.length).replace('완료', `${cls.length}반 완료`);
    if(left.length && done) txt += ` · 남은 반 ${left.join(', ')}`;
    if(ncs.length) txt += ` · NCS ${nd}/${ncs.length}`;
    return txt;
  }
  return mark(n,t);
}
function payload(card){
  const cards = cardsNow(); let a=0,b=0; cards.forEach(c=>{ const [x,y]=cardCount(c); a+=x; b+=y; });
  const memoAll = cards.filter(c=>data[c.id]&&data[c.id].memo).map(c=>`[${c.label}] ${data[c.id].memo}`).join(' / ');
  const v = { date: card.label, progress: `${b?Math.round(a/b*100):0}% (${a}/${b})`, memo: memoAll };
  if(state.role==='homeroom'){
    Object.assign(v, { grade:state.g, cls:state.c, name:state.name });
    H_CARDS.filter(c=>!c.comb).forEach(c=>v[c.id]=cardText(c));
    { const grp=H_CARDS.filter(c=>c.id==='h1224'||c.comb==='h1224'); let a2=0,b2=0; grp.forEach(c=>{ const [x,y]=cardCount(c); a2+=x; b2+=y; });
      const sh={h1221:'자격증철',h1223:'점검표',h1224:'진로·최종'};
      v.h1224 = mark(a2,b2) + ' · ' + grp.map(c=>{ const [x,y]=cardCount(c); return `${sh[c.id]} ${x===y?'✅':x===0?'⬜':x+'/'+y}`; }).join(' '); }
  } else {
    v.name = state.teacher;
    v.assign = [(TEACHERS[state.teacher]||[]).map(x=>`${x.subj} ${x.g}학년 ${x.classes.join(',')}반`).join(' / '),
      (CAREER[state.teacher]||[]).length?'진로: '+CAREER[state.teacher].map(a=>`${a.g}학년 ${a.classes.join(',')}반`).join(' / '):'',
      (CLUBS[state.teacher]||[]).length?'동아리: '+CLUBS[state.teacher].join(','):'',
      SUBT(state.teacher).length?'부담임: '+SUBT(state.teacher).map(h=>`${h.g}-${h.c}`).join(','):''].filter(Boolean).join(' / ');
    const sc = sCards(), se = sc.find(c=>c.id==='s1209');
    { const pn=S_PRE.filter(p=>isOn('s1209',p.id)).length, miss=S_PRE.map((p,i)=>isOn('s1209',p.id)?'':['작성안내','맞춤법','기재불가'][i]).filter(Boolean);
      v.s1209pre = pn===3?'✅ 완료':pn===0?'⬜ 0/3':`🟡 ${pn}/3 · ${miss.join('·')} 남음`; }
    ['s1209','s1211','s1214','s1216','s1217','s1224'].forEach(id=>{ const c=sc.find(x=>x.id===id); v[id] = c?cardText(c):'—'; });
    { const p=sc.find(x=>x.id==='s1223'), f=sc.find(x=>x.id==='s1224'); if(p){ const [a1,b1]=cardCount(p),[a2,b2]=cardCount(f); v.s1224 = mark(a1+a2,b1+b2)+` · 점검표 ${a1===b1?'✅':'⬜'} 최종 ${a2===b2?'✅':'⬜'}`; } }
    if(!sc.find(x=>x.id==='s1209')) v.s1209pre='—';
    [['c1207','career1207'],['c1224','career1224']].forEach(([id,f])=>{ const c=sc.find(x=>x.id===id); v[f] = c?cardText(c):'해당없음'; });
    if(!FORMS.subject.entries.career1207 && (CAREER[state.teacher]||[]).length) v.memo = `[진로 12/7] ${v.career1207} [진로 12/24] ${v.career1224}` + (v.memo?' / '+v.memo:'');
  }
  return v;
}

const timers = {};
function autoSend(card, wait){
  if(state.admin){ const d=data[card.id]; if(d){ d.dirty=false; save(); } setTimeout(()=>{ const el=$('#card-'+card.id); if(el){ const h=el.classList.contains('hidden'); renderCard(card, el, el.classList.contains('spot'), today()); el.classList.add('open'); if(h) el.classList.add('hidden'); } }, 50); return; }
  clearTimeout(timers[card.id]);
  timers[card.id] = setTimeout(()=>{ const el=$('#card-'+card.id); if(el) send(card, el); }, wait||1500);
}
window.addEventListener('beforeunload', ()=>{ Object.keys(timers).forEach(id=>{ const c=cardsNow().find(x=>x.id===id); if(c && data[id] && data[id].dirty){ clearTimeout(timers[id]); send(c, $('#card-'+id)); } }); });
function send(card, el){
  const f = FORMS[state.role];
  if(!f.action){ toast('아직 시트 연결 전이에요. 체크 내용은 이 기기에 저장돼 있어요.'); return; }
  const v = payload(card);
  const form = document.createElement('form');
  form.method='POST'; form.action=f.action; form.target='sinkFrame'; form.style.display='none';
  Object.entries(f.entries).forEach(([k,entry])=>{
    if(!entry) return;
    const i=document.createElement('input'); i.type='hidden'; i.name=entry; i.value=v[k]!=null?v[k]:''; form.appendChild(i);
  });
  document.body.appendChild(form); form.submit(); form.remove();
  data[card.id] = data[card.id] || {checks:{}}; data[card.id].sent = nowStr(); data[card.id].dirty = false; save();
  const hid = el.classList.contains('hidden'), focusMemo = document.activeElement && document.activeElement.classList.contains('memo') && el.contains(document.activeElement);
  if(!focusMemo){ renderCard(card, el, el.classList.contains('spot'), today()); el.classList.add('open'); if(hid) el.classList.add('hidden'); }
  toast(`${card.label} 체크 내용이 시트에 기록됐어요.`);
}

$('#lb').onclick = () => $('#lb').classList.remove('on');
document.addEventListener('keydown', e=>{ if(e.key==='Escape') $('#lb').classList.remove('on'); });
(()=>{ let ok=false; try{ ok = new URLSearchParams(location.search).get('hub')==='1' && sessionStorage.getItem('sgb:adminok')==='1'; }catch(e){} ok ? adminHub() : home(); })();
</script>
